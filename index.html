<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澹台明玉 金口訣 · 製作：SHENG</title>
<style>
  :root{
    --paper:#efe7d3; --card:#fbf7ec; --ink:#231d14; --ink2:#6d5f47;
    --line:#d5c6a5; --zhu:#9e2f28; --qing:#2c5673; --green:#2a6b4a;
    --gold:#a8863c; --tagbg:#ece0c8;
    /* 四層專屬色：人元石青／貴神硃砂／將神黛紫／地分赭褐 */
    --c-ren:#2f6690; --c-gui:#a63a2e; --c-jiang:#5f3b6e; --c-di:#7d5427;
    --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","STSong","PMingLiU","MingLiU",serif;
    --kai:"Kaiti TC","標楷體","DFKai-SB","STKaiti","KaiTi",serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;color:var(--ink);
    font-family:var(--serif);font-size:15px;line-height:1.7;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(170,145,100,.14), transparent 46%),
      repeating-linear-gradient(0deg, rgba(120,100,70,.03) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.022) 0 1px, transparent 1px 5px);
    background-attachment:fixed;
  }
  /* ===== 頁首 ===== */
  header{
    position:relative;overflow:hidden;text-align:center;
    padding:34px 26px 26px;color:#f1e4c6;
    background:
      radial-gradient(circle at 50% -30%, rgba(184,147,63,.28), transparent 62%),
      linear-gradient(160deg,#252c33,#151a20 55%,#1b2229);
    border-bottom:3px double var(--zhu);
    box-shadow:0 8px 26px rgba(20,15,8,.35);
  }
  header::before{
    content:'';position:absolute;left:0;right:0;top:0;height:5px;
    background:linear-gradient(90deg,transparent,rgba(184,147,63,.75),transparent);
  }
  header::after{
    content:'';position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    width:220px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(184,147,63,.85),transparent);
  }
  header h1{margin:0;text-align:center;line-height:1.28;}
  header h1 span{
    display:block;font-family:var(--kai);font-weight:700;color:#f4e6c2;
    text-shadow:0 2px 14px rgba(0,0,0,.55), 0 0 2px rgba(201,169,97,.7);
  }
  header h1 .h1-l1{font-size:40px;letter-spacing:14px;text-indent:14px;}
  header h1 .h1-l2{font-size:29px;letter-spacing:17px;text-indent:17px;color:#e7cf95;margin-top:5px;}
  header p{margin:8px 0 0;font-size:13px;color:#b9c2cb;letter-spacing:2px;}
  header p.maker{
    display:inline-block;margin:16px auto 0;padding:3px 14px;
    font-family:var(--kai);font-size:15px;letter-spacing:4px;color:#e7cf95;
    border:1px solid rgba(184,147,63,.55);border-radius:2px;
    background:rgba(158,47,40,.18);
  }
  .wrap{max-width:1220px;margin:0 auto;padding:22px 20px 40px;}
  /* ===== 面板（宣紙卡片、雙線框） ===== */
  .panel{
    position:relative;
    background:linear-gradient(#fffdf6,#fbf6ea);
    border:1px solid #c8b78f;border-radius:3px;
    padding:20px 22px;margin-bottom:20px;
    box-shadow:0 1px 0 #fff inset, 0 6px 20px rgba(90,70,35,.09);
  }
  .panel::before{
    content:'';position:absolute;inset:5px;border:1px solid rgba(168,134,60,.24);
    border-radius:2px;pointer-events:none;
  }
  .panel > *{position:relative;}
  .panel h2{
    display:flex;align-items:center;gap:11px;
    margin:0 0 16px;font-family:var(--kai);font-size:20px;font-weight:700;
    color:var(--zhu);letter-spacing:3px;
  }
  .panel h2::before{
    content:'';flex:0 0 auto;width:6px;height:20px;border-radius:1px;
    background:linear-gradient(180deg,#b23a30,#7c211c);
    box-shadow:0 0 0 1px rgba(255,255,255,.55);
  }
  .panel h2::after{
    content:'';flex:1 1 auto;height:1px;
    background:linear-gradient(90deg,rgba(168,134,60,.55),rgba(168,134,60,0));
  }
  .panel h3{margin:16px 0 9px;font-family:var(--kai);font-size:15.5px;color:var(--qing);font-weight:700;letter-spacing:1px;}
  .grid{display:grid;gap:12px;}
  /* minmax(0,1fr) 才能讓欄位縮到比內容最小寬度更窄（iOS 的 date/time 輸入有不可壓縮寬度） */
  .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .grid>div{min-width:0;}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
  label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;letter-spacing:1px;}
  input,select,button{font-family:var(--serif);font-size:14px;}
  input[type=date],input[type=time],input[type=number],input[type=text],select{
    width:100%;min-width:0;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;
    background:#fffdf7;color:var(--ink);
    box-shadow:0 1px 2px rgba(120,100,60,.06) inset;
    transition:border-color .18s, box-shadow .18s;
  }
  /* iOS Safari：date/time 內部欄位不可壓縮，需放寬 min-width 並收窄內距 */
  input[type=date],input[type=time]{overflow:hidden;padding-right:6px;}
  @media(max-width:560px){
    #pane-solar .g4{grid-template-columns:minmax(0,1fr) minmax(0,8em);}
  }
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,134,60,.14);}
  button{cursor:pointer;border:none;border-radius:3px;padding:9px 18px;font-size:14px;letter-spacing:2px;transition:transform .08s, filter .18s;}
  .btn-main{
    font-family:var(--kai);font-weight:700;letter-spacing:6px;color:#fff;
    background:linear-gradient(180deg,#b23a30,#8f2b25);
    box-shadow:0 2px 0 #6d1e19, 0 5px 14px rgba(140,45,32,.28);
  }
  .btn-main:hover{filter:brightness(1.06);}
  .btn-main:active{transform:translateY(1px);box-shadow:0 1px 0 #6d1e19;}
  .btn-sub{background:#e9dfc9;color:var(--ink);border:1px solid var(--line);}
  .btn-sub:hover{background:#e0d4b8;}
  .btn-now{
    font-family:var(--kai);font-weight:700;letter-spacing:3px;color:#fff;
    background:linear-gradient(180deg,#356a8c,#244a67);
    box-shadow:0 2px 0 #1a3850, 0 5px 14px rgba(36,74,103,.25);
  }
  .btn-now:hover{filter:brightness(1.06);}
  .btn-now.on{background:linear-gradient(180deg,#2b5c7d,#1e3f58);}
  .btn-sub.on{background:linear-gradient(180deg,#b23a30,#8f2b25);color:#fff;font-weight:700;}
  .btn-sub.on:hover{filter:brightness(1.06);}
  .zhi-btns{display:flex;flex-wrap:wrap;gap:7px;}
  .zhi-btns button{
    background:#f4eedf;border:1px solid var(--line);color:var(--ink);
    padding:5px 13px;border-radius:2px;font-size:14px;letter-spacing:1px;
  }
  .zhi-btns button:hover{border-color:var(--gold);background:#f8f2e3;}
  .zhi-btns button.on{background:linear-gradient(180deg,#b23a30,#8f2b25);color:#fff;border-color:#8f2b25;font-weight:700;box-shadow:0 1px 4px rgba(140,45,32,.3);}
  .zhi-btns button.auto{background:linear-gradient(180deg,#356a8c,#244a67);color:#fff;border-color:#244a67;border-style:dashed;font-weight:700;}
  /* ===== 表格 ===== */
  table{border-collapse:collapse;width:100%;}
  .ke-table td,.ke-table th{padding:10px 12px;border-bottom:1px solid #e3d8c0;vertical-align:middle;}
  .ke-table th{
    background:linear-gradient(180deg,#f1e7d2,#e9dcc0);
    color:#5a4a2f;font-family:var(--kai);font-size:13.5px;text-align:left;
    letter-spacing:2px;border-bottom:2px solid #c8b78f;border-top:1px solid #ded1b6;
  }
  .ke-table tr:hover td{background:rgba(168,134,60,.05);}
  .ke-layer{font-family:var(--kai);font-weight:700;color:var(--qing);white-space:nowrap;width:70px;font-size:16px;letter-spacing:1px;}
  .gz{font-family:var(--kai);font-size:23px;font-weight:700;white-space:nowrap;color:var(--ink);}
  .gz .gz-wrap{display:inline-grid;grid-template-columns:1.5em 1.5em auto;column-gap:0.45em;align-items:center;}
  .gz .slot{text-align:center;}
  .gz .slot-gan,.gz .slot-zhi{width:1.5em;}
  .gz .slot-tj{text-align:left;font-weight:700;}
  /* 四層文字色：整列干支與神將同色，神將略深一階以示層級 */
  .ke-table tr.lay-ren .gz .slot{color:var(--c-ren);}
  .ke-table tr.lay-gui .gz .slot{color:var(--c-gui);}
  .ke-table tr.lay-jiang .gz .slot{color:var(--c-jiang);}
  .ke-table tr.lay-di .gz .slot{color:var(--c-di);}
  .ke-table tr.lay-ren .ke-layer{color:var(--c-ren);}
  .ke-table tr.lay-gui .ke-layer{color:var(--c-gui);}
  .ke-table tr.lay-jiang .ke-layer{color:var(--c-jiang);}
  .ke-table tr.lay-di .ke-layer{color:var(--c-di);}
  .ke-table tr.lay-ren .gz .slot-tj,
  .ke-table tr.lay-gui .gz .slot-tj,
  .ke-table tr.lay-jiang .gz .slot-tj{filter:brightness(.82);}
  .gz .gz-wrap.yongrow{border-bottom:2.5px solid var(--green);padding-bottom:1px;}
  .yong{color:var(--green);}
  .yong-line{display:inline-block;border-bottom:2.5px solid var(--green);padding-bottom:1px;}
  .tianjiang{color:var(--gold);font-size:14.5px;margin-left:8px;letter-spacing:1px;white-space:nowrap;}
  .wxinfo{font-size:13.5px;color:var(--ink2);white-space:nowrap;}
  .yy-plus{color:var(--zhu);font-weight:700;} .yy-minus{color:var(--qing);font-weight:700;}
  .wang{color:var(--green);font-weight:700;} .xiang{color:#3f7d43;font-weight:700;}
  .xiu{color:#8a7a3a;font-weight:700;} .qiu{color:#b06a1e;font-weight:700;}
  .si{color:var(--zhu);font-weight:700;} .kong{color:#8a8f98;font-weight:700;}
  .liuqin{font-family:var(--kai);font-size:13px;background:var(--tagbg);border:1px solid #dccdaa;border-radius:2px;padding:2px 9px;margin-right:6px;white-space:nowrap;}
  .ke-table tr.hl td{background:#fbe9e5;}
  .ke-table tr.hl2 td{background:#e8f3ea;}
  .badge-di{display:inline-block;background:linear-gradient(180deg,#b23a30,#8f2b25);color:#fff;font-size:11px;border-radius:2px;padding:0 6px;margin-left:5px;vertical-align:middle;letter-spacing:1px;box-shadow:0 1px 2px rgba(140,45,32,.3);}
  .badge-zhan{display:inline-block;background:linear-gradient(180deg,#2f7355,#225640);color:#fff;font-size:11px;border-radius:2px;padding:0 6px;margin-left:5px;vertical-align:middle;letter-spacing:1px;box-shadow:0 1px 2px rgba(34,86,64,.3);}
  .yong-badge{display:inline-block;background:linear-gradient(180deg,#2f7355,#225640);color:#fff;font-size:12px;font-weight:700;border-radius:2px;padding:0 7px;margin-left:8px;vertical-align:middle;letter-spacing:2px;box-shadow:0 1px 3px rgba(34,86,64,.35);}
  .ss-tag{display:inline-block;font-size:12.5px;border-radius:2px;padding:1px 7px;margin:1px 3px 1px 0;white-space:nowrap;}
  .ss-ji{background:#e4f0e6;color:#256b4a;border:1px solid #b9d6c1;}
  .ss-xiong{background:#f8e3e0;color:#9e2f28;border:1px solid #e4bcb6;}
  .ss-ping{background:#eceef1;color:#5a6470;border:1px solid #d3d8dd;}
  /* ===== 起課資訊 ===== */
  .k-info{font-size:14.5px;}
  .pill{
    display:inline-block;border-radius:2px;padding:1px 10px;font-size:13.5px;
    margin:2px 7px 2px 0;letter-spacing:1px;
    background:linear-gradient(180deg,#2a323a,#1b2229);color:#f1e4c6;
    border:1px solid rgba(168,134,60,.45);
  }
  .note{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.75;}
  .dong{
    background:linear-gradient(#fdf7e8,#fbf1da);
    border:1px solid #e3d3ac;border-left:4px solid var(--gold);
    border-radius:2px;padding:11px 15px;margin-top:12px;
  }
  .dong .t{font-family:var(--kai);font-weight:700;color:var(--gold);letter-spacing:2px;}
  /* ===== 地盤九宮格 ===== */
  .dp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0;}
  .dp-cell{
    position:relative;text-align:left;
    border:1px solid #cdbb96;border-radius:4px;
    background:linear-gradient(#fffdf7,#fbf6ea);
    padding:9px 6px;min-height:104px;
    display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:0;
    box-shadow:0 1px 0 #fff inset, 0 2px 7px rgba(90,70,35,.07);
  }
  .dp-cell::before{
    content:'';position:absolute;inset:3px;border:1px solid rgba(168,134,60,.16);
    border-radius:2px;pointer-events:none;
  }
  .dp-cell .dc-row{display:block;line-height:1.35;position:relative;}
  .dp-cell .dc-grid{display:inline-grid;grid-template-columns:1.2em 1.2em auto;column-gap:0.18em;align-items:center;font-family:var(--kai);font-size:16px;font-weight:700;}
  .dp-cell .slot{text-align:center;}
  .dp-cell .slot-gan,.dp-cell .slot-zhi{width:1.2em;}
  .dp-cell .slot-tj{text-align:left;}
  .dp-cell .dc-ren .slot{color:var(--c-ren);}
  .dp-cell .dc-gui .slot{color:var(--c-gui);}
  .dp-cell .dc-jiang .slot{color:var(--c-jiang);}
  .dp-cell .dc-di .slot{color:var(--c-di);}
  .dp-cell .dc-gui .slot-tj,
  .dp-cell .dc-jiang .slot-tj{filter:brightness(.82);}
  .dp-cell.yl-ren .dc-ren .dc-grid,
  .dp-cell.yl-gui .dc-gui .dc-grid,
  .dp-cell.yl-jiang .dc-jiang .dc-grid,
  .dp-cell.yl-di .dc-di .dc-grid{border-bottom:2px solid var(--green);}
  .dp-cell.hl{border:2px solid var(--zhu);background:linear-gradient(#fdf0ec,#fae7e2);box-shadow:0 0 0 3px rgba(158,47,40,.1), 0 2px 8px rgba(140,45,32,.12);}
  .dp-cell.hl2{border:2px solid var(--green);background:linear-gradient(#eef7ef,#e4f2e7);box-shadow:0 0 0 3px rgba(42,107,74,.1);}
  .dp-cell .mk{position:absolute;top:2px;right:5px;font-size:11px;color:#fff;background:linear-gradient(180deg,#b23a30,#8f2b25);border-radius:2px;padding:0 5px;letter-spacing:1px;z-index:2;}
  .dp-cell .mk2{position:absolute;top:2px;left:5px;font-size:11px;color:#fff;background:linear-gradient(180deg,#2f7355,#225640);border-radius:2px;padding:0 5px;letter-spacing:1px;z-index:2;}
  .dp-mid{visibility:hidden;}
  .sixrow td{padding:5px 9px;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .sixrow .l{color:var(--qing);font-weight:700;white-space:nowrap;}
  .warn{background:#fdf5e0;border:1px solid #e6d3a2;border-left:4px solid var(--gold);color:#7a5c13;border-radius:2px;padding:9px 13px;font-size:13px;margin-top:8px;}
  .footer{font-size:12px;color:var(--ink2);text-align:center;padding:18px 0 30px;line-height:1.8;}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .flex>div{flex:1;min-width:130px;}
  .mb8{margin-bottom:9px;}
  .ss-grp{margin-bottom:11px;}
  .ss-grp .gt{font-family:var(--kai);font-weight:700;color:var(--ink);font-size:14px;margin-bottom:5px;letter-spacing:1px;}
  .ss-row{font-size:13px;color:var(--ink2);line-height:2;}
  .ss-row b{color:var(--ink);}
  /* ===== 方格卡片 ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;margin-top:9px;}
  .card{border:1px solid #d8c9a8;border-radius:3px;padding:9px 11px;background:linear-gradient(#fffdf7,#fbf6ea);font-size:13.5px;line-height:1.58;box-shadow:0 1px 3px rgba(90,70,35,.06);}
  .card .ct{font-family:var(--kai);font-weight:700;color:var(--qing);margin-bottom:4px;letter-spacing:1px;}
  .card .cr{font-size:12.5px;color:var(--ink2);margin:2px 0;}
  .card .cr b{color:var(--ink);}
  /* ===== 輸入模式切換 ===== */
  .mode-tabs{display:flex;gap:7px;margin:0 0 13px;}
  .mode-tabs button{
    font-family:var(--kai);font-size:14.5px;letter-spacing:2px;cursor:pointer;
    padding:6px 18px;border:1px solid #cdbb96;border-radius:3px;
    background:linear-gradient(#f9f3e2,#efe5cc);color:#6d5f47;
    transition:all .15s;
  }
  .mode-tabs button:hover{border-color:var(--gold);}
  .mode-tabs button.on{
    background:linear-gradient(180deg,#b23a30,#8f2b25);color:#fff;
    border-color:#8f2b25;font-weight:700;
    box-shadow:0 1px 5px rgba(140,45,32,.3);
  }
  .hidden{display:none!important;}
  .gz-pair{display:flex;gap:6px;}
  .gz-pair select{
    flex:1 1 0;min-width:0;text-align:center;text-align-last:center;
    font-family:var(--kai);font-size:16px;font-weight:700;padding-left:4px;padding-right:4px;
  }
  .gz-pair select:first-child{color:var(--ink);}
  .gz-pair select:last-child{color:var(--qing);}
  .gz-hit{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
  .gz-hit button{
    font-family:var(--kai);font-size:13.5px;letter-spacing:1px;cursor:pointer;
    padding:5px 13px;border:1px solid #cdbb96;border-radius:3px;
    background:linear-gradient(#fdf8ea,#f6eeda);color:var(--ink);
  }
  .gz-hit button:hover{border-color:var(--zhu);color:var(--zhu);}
  .gz-hit button.near{border-color:var(--gold);background:linear-gradient(#fdf2d8,#f8e9c4);}
  /* ===== 地分圖例 ===== */  .difen-legend{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.9;letter-spacing:.5px;}
  .difen-legend i{display:inline-block;width:22px;height:0;vertical-align:middle;margin:0 5px 0 2px;}
  .difen-legend i.lg-on{border-top:3px solid var(--zhu);}
  .difen-legend i.lg-auto{border-top:3px dashed #244a67;}
  /* ===== 旺衰：課外旺爻 ===== */
  .wy-sum{font-size:14px;color:var(--ink);line-height:1.95;}
  .wy-sum b{color:var(--qing);}
  .wk-band{border:1px solid #dccdaa;border-left:4px solid var(--gold);border-radius:3px;background:linear-gradient(#fdf8ec,#faf2df);padding:11px 14px;margin-top:9px;}
  .wk-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;}
  .wk-chip{display:inline-flex;align-items:baseline;gap:7px;font-family:var(--kai);font-size:15px;font-weight:700;border:1px solid #d8c9a8;border-radius:3px;padding:4px 11px;background:linear-gradient(#fffdf7,#fbf6ea);}
  .wk-chip i{font-style:normal;font-size:12px;font-weight:400;color:var(--ink2);letter-spacing:1px;}
  .wk-chip .lv{font-size:15px;}
  .wk-chip.on{border-color:var(--gold);background:linear-gradient(#fdf1d6,#f7e9c5);box-shadow:0 0 0 2px rgba(168,134,60,.18);}
  .wk-res{font-size:13.5px;color:var(--ink2);line-height:1.85;border-top:1px dashed #e0d0ac;padding-top:9px;}
  .wk-res b{color:var(--gold);font-family:var(--kai);font-size:16px;letter-spacing:1px;}
  .wk-res .tag{display:inline-block;background:linear-gradient(180deg,#b8933f,#96762c);color:#fff;font-size:11.5px;font-weight:700;border-radius:2px;padding:1px 8px;margin-left:8px;letter-spacing:1px;vertical-align:middle;}
  .ss-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:7px;}
  .ss-card{border:1px solid #d8c9a8;border-radius:3px;padding:7px 9px;background:linear-gradient(#fffdf7,#fbf6ea);font-size:13px;line-height:1.45;}
  .ss-card .sn{font-weight:700;}
  .ss-card .sp{font-size:11.5px;color:var(--ink2);}
  .panel-stack{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px;}
  .panel-stack .panel{margin-bottom:0;}
  /* ===== 繁／簡界面切換按鈕 ===== */
  .lang-btn{
    position:absolute;top:21px;left:26px;z-index:6;
    display:inline-flex;align-items:center;justify-content:center;
    min-width:52px;padding:5px 12px;cursor:pointer;
    font-family:var(--kai);font-size:14.5px;font-weight:700;letter-spacing:3px;
    color:#e7cf95;

</header>
<div class="wrap">

  <div class="panel">
    <h2>一、起課輸入</h2>
    <div class="mode-tabs">
      <button class="mt on" id="mt-solar">公曆輸入</button>

    </div>

    <div id="pane-solar">

        </div>
      </div>
    </div>

    <div id="pane-ganzhi" class="hidden">
      <div class="grid g4 mb8">
        <div><label>年柱（立春換年）</label>
          <div class="gz-pair"><select id="gz-y-g"></select><select id="gz-y-z"></select></div></div>
        <div><label>月柱（節氣月）</label>
          <div class="gz-pair"><select id="gz-m-g"></select><select id="gz-m-z"></select></div></div>
        <div><label>日柱</label>
          <div class="gz-pair"><select id="gz-d-g"></select><select id="gz-d-z"></select></div></div>
        <div><label>時柱</label>
          <div class="gz-pair"><select id="gz-h-g"></select><select id="gz-h-z"></select></div></div>
      </div>
      <div class="flex" style="gap:10px;justify-content:flex-start;">
        <div style="flex:0 0 auto"><button class="btn-now" id="btn-gz-now" title="把四個欄位填為此刻的四柱">取現在四柱</button></div>
        <div style="flex:0 0 auto"><button class="btn-now" id="btn-gz-conv" title="依干支反推公曆並起課">換算並起課</button></div>
      </div>
      <div id="gz-result" class="note"></div>
    </div>

    </div>
    <div class="flex" style="gap:10px;justify-content:flex-start;">
      <div style="flex:0 0 auto"><button class="btn-main" id="btn-run">起 課</button></div>
    </div>

  </div>

var JQ_DATA={};
function b64ToBytes(b64){var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function initJieqi(){
  var bytes=b64ToBytes(JIEQI_B64);
  for(var y=1900;y<=2100;y++){
    var off=(y-1900)*72, arr=[], base=new Date(y,0,1).getTime();
    for(var i=0;i<24;i++){
      var v=(bytes[off+i*3]<<16)|(bytes[off+i*3+1]<<8)|bytes[off+i*3+2];
      arr.push({name:JQ[i],t:new Date(base+v*60000)});
    }
    JQ_DATA[y]=arr;
  }
}
function jieqiAround(dt){
  var y=dt.getFullYear(), list=[];
  [y-1,y,y+1].forEach(function(yy){ if(JQ_DATA[yy]) list=list.concat(JQ_DATA[yy]); });
  list.sort(function(a,b){return a.t-b.t;});
  var prev=null,next=null;
  for(var i=0;i<list.length;i++){ if(list[i].t<=dt) prev=list[i]; }
  for(var j=0;j<list.length;j++){ if(list[j].t>dt){ next=list[j]; break; } }
  return {prev:prev,next:next};
}
function stepBack(e){
  var y=e.t.getFullYear(), list=[];
  [y-1,y].forEach(function(yy){ if(JQ_DATA[yy]) list=list.concat(JQ_DATA[yy]); });
  list.sort(function(a,b){return a.t-b.t;});
  var np=null; for(var i=0;i<list.length;i++){ if(list[i].t<e.t) np=list[i]; }
  return np;
}
function prevJie(dt){
  var p=jieqiAround(dt).prev, guard=0;
  while(p && !JIE_YUEJIAN[p.name] && guard++<6) p=stepBack(p);
  return p;
}
function prevZhongQi(dt){
  var p=jieqiAround(dt).prev, guard=0;
  while(p && !ZQ_YUEJIANG[p.name] && guard++<6) p=stepBack(p);
  return p;
}

/* ==================== 四柱 ==================== */
function siZhu(dt){
  var y=dt.getFullYear();
  var lichun=null;
  [y-1,y].forEach(function(yy){
    (JQ_DATA[yy]||[]).forEach(function(e){ if(e.name==='立春') lichun=e; });
  });
  var year=(lichun && dt<lichun.t)?y-1:y;
  var yGan=GAN[((year-4)%10+10)%10], yZhi=ZHI[((year-4)%12+12)%12];
  var pj=prevJie(dt);
  var yueJian=pj?JIE_YUEJIAN[pj.name]:'寅';
  var yueGan=GAN[((gi(yGan)*2+2+((zi(yueJian)-2+12)%12))%10+10)%10];
  var days=Math.floor((Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-Date.UTC(1900,0,1))/86400000);
  var dIdx=((10+days)%60+60)%60;
  var dGan=GAN[dIdx%10], dZhi=ZHI[dIdx%12];
  var h=dt.getHours();
  var hZhi=ZHI[(h>=23)?0:Math.floor((h+1)/2)];
  var hGan=GAN[((gi(dGan)*2+zi(hZhi))%10+10)%10];
  return {year:year,yGan:yGan,yZhi:yZhi,yueGan:yueGan,yueJian:yueJian,
          dGan:dGan,dZhi:dZhi,hGan:hGan,hZhi:hZhi,jieName:pj?pj.name:''};
}
function xunInfo(dGan,dZhi){
  var i=0; for(i=0;i<60;i++){ if(GAN[i%10]===dGan && ZHI[i%12]===dZhi) break; }
  var xunIdx=Math.floor(i/10)*10;
  var xunZhi=ZHI[xunIdx%12];
  return {idx:i,xunZhi:xunZhi,kong:[ZHI[(xunIdx+10)%12],ZHI[(xunIdx+11)%12]],name:'甲'+xunZhi+'旬'};
}

/* ==================== 起課 ==================== */
function buildKe(dt,diFen){
  var sz=siZhu(dt);
  var xi=xunInfo(sz.dGan,sz.dZhi);
  var zq=prevZhongQi(dt);
  var yueJiang=zq?ZQ_YUEJIANG[zq.name]:'巳';
  var hourZhi=sz.hZhi;
  var dayNight=(['卯','辰','巳','午','未','申'].indexOf(hourZhi)>=0)?'晝':'夜';
  var jiangZhi=ZHI[((zi(yueJiang)+zi(diFen)-zi(hourZhi))%12+12)%12];
  var jiangGan=dunGan(sz.dGan,jiangZhi);
  var gr=dayNight==='晝'?GUI_REN[sz.dGan][0]:GUI_REN[sz.dGan][1];
  var shun=(SHUN_ZONE.indexOf(gr)>=0);
  var d=(zi(diFen)-zi(gr)+12)%12;
  var tianJiang=TIANJIANG[shun?d:(12-d)%12];
  var guiZhi=BENJIA[tianJiang];
  var guiGan=dunGan(sz.dGan,guiZhi);
  var renGan=dunGan(sz.dGan,diFen);
  return {sz:sz,xi:xi,yueJiang:yueJiang,zhongqi:zq?zq.name:'',
    hourZhi:hourZhi,dayNight:dayNight,diFen:diFen,
    ren:{gan:renGan,zhi:null,tj:null,wx:WXG[renGan]},
    gui:{gan:guiGan,zhi:guiZhi,tj:tianJiang,wx:WXZ[guiZhi]},
    jiang:{gan:jiangGan,zhi:jiangZhi,tj:JIANG_NAME[jiangZhi],wx:WXZ[jiangZhi]},
    di:{gan:null,zhi:diFen,tj:null,wx:WXZ[diFen]},
    guiRen:gr,guiShun:shun};
}
function tianjiangAt(z,gr,shun){
  var d=(zi(z)-zi(gr)+12)%12;
  return TIANJIANG[shun?d:(12-d)%12];
}
function tianpanAt(z,yueJiang,hourZhi){
  return ZHI[((zi(yueJiang)+zi(z)-zi(hourZhi))%12+12)%12];
}

/* ==================== 用爻 ==================== */
function pickYongshen(ke){
  var L=[
    {k:'人元',yy:isYangGan(ke.ren.gan)},
    {k:'貴神',yy:isYangGan(ke.gui.gan)},
    {k:'將神',yy:isYangGan(ke.jiang.gan)},
    {k:'地分',yy:isYangZhi(ke.di.zhi)}];
  var nY=L.filter(function(x){return x.yy;}).length, nYin=4-nY;
  if(nY===4) return {layer:'貴神',rule:'四爻純陽，以神為用（老陽）',L:L};
  if(nYin===4) return {layer:'將神',rule:'四爻純陰，以將為用（老陰）',L:L};
  if(nY===1) return {layer:L.filter(function(x){return x.yy;})[0].k,rule:'三陰一陽，以陽為用（少陽）',L:L};
  if(nYin===1) return {layer:L.filter(function(x){return !x.yy;})[0].k,rule:'三陽一陰，以陰為用（少陰）',L:L};
  return {layer:'將神',rule:'兩陰兩陽，以將為用（將為主，神為客）',L:L};
}

/* ==================== 課內旺爻與旺衰 ==================== */
function findWangYao(ke){
  var wx=[ke.ren.wx,ke.gui.wx,ke.jiang.wx,ke.di.wx];
  var zh=[ke.gui.zhi,ke.jiang.zhi,ke.di.zhi];
  var uniq=[]; wx.forEach(function(w){ if(uniq.indexOf(w)<0) uniq.push(w); });
  var rule='';
  var noKe=uniq.filter(function(x){ return !uniq.some(function(y){return KE[y]===x;}); });
  var cand=noKe.length?noKe:uniq.slice();
  if(noKe.length) rule='無克為旺';
  if(cand.length>1){
    var cnt={}; wx.forEach(function(w){cnt[w]=(cnt[w]||0)+1;});
    var mx=Math.max.apply(null,cand.map(function(w){return cnt[w];}));
    cand=cand.filter(function(w){return cnt[w]===mx;});
    rule+=(rule?' → ':'')+'多為旺';
  }
  if(cand.length>1){
    var HE=[['亥卯未','木'],['寅午戌','火'],['巳酉丑','金'],['申子辰','水'],
            ['寅卯辰','木'],['巳午未','火'],['申酉戌','金'],['亥子丑','水']];
    for(var i=0;i<HE.length;i++){
      var n=0; for(var c of HE[i][0]){ if(zh.indexOf(c)>=0) n++; }
      if(n>=2 && cand.indexOf(HE[i][1])>=0){ cand=[HE[i][1]]; rule+=(rule?' → ':'')+'合局為旺'; break; }
    }
  }
  if(cand.length>1 && wx.every(function(w){return w===wx[0];})){ cand=[wx[0]]; rule+=(rule?' → ':'')+'一氣為旺'; }

}

/* 課外旺衰：以月令五行為「我」判旺相休囚死
   同我（當令）＝旺、我生＝相、生我＝休、克我＝囚、我克＝死 */
function kewaiLevel(wx,yueJian){
  var mw=WXZ[yueJian];
  if(wx===mw) return '旺';
  if(SHENG[mw]===wx) return '相';
  if(SHENG[wx]===mw) return '休';
  if(KE[wx]===mw) return '囚';
  return '死';
}

  return {旺:'同月令，當令',相:'月令生我',休:'生月令',囚:'克月令',死:'月令克我'}[kewaiLevel(wx,yueJian)];
}
/* 課外旺爻：依序取 旺＞相＞休＞囚＞死 中最高者為旺爻 */
function findWangYaoByMonth(ke){
  var rows=[['人元',ke.ren.wx],['貴神',ke.gui.wx],['將神',ke.jiang.wx],['地分',ke.di.wx]];
  var lvs=rows.map(function(r){ return kewaiLevel(r[1],ke.sz.yueJian); });
  var order=['旺','相','休','囚','死'];
  var ruleMap={
    旺:'四層中有同月令之爻，得月令本氣，為真旺',
    相:'四層無當令之爻，取月令所生者（相）為旺',
    休:'四層無旺無相，取生月令者（休）為旺',
    囚:'四層無旺相休，取克月令者（囚）為旺',
    死:'四層皆被月令所克，以死中取旺'
  };
  for(var i=0;i<order.length;i++){
    var lv=order[i], hit=[];
    lvs.forEach(function(l,j){ if(l===lv) hit.push({name:rows[j][0],wx:rows[j][1]}); });
    if(hit.length){
      return {level:lv, rule:ruleMap[lv], rows:rows, lvs:lvs, list:hit,
        names:hit.map(function(x){return x.name+'（'+x.wx+'）';}).join('、')};
    }
  }
}

function calcShensha(sz,xi){
  var out=[];
  function add(name,base,jx,pos,gan){ out.push({name:name,base:base,jx:jx,pos:pos,gan:gan||null}); }
  var yGan=sz.yGan,yZhi=sz.yZhi,yueJian=sz.yueJian;
  var dGan=sz.dGan,dZhi=sz.dZhi;
  var yIdx=zi(yZhi), mIdx=(zi(yueJian)-2+12)%12;
  var season=seasonOf(yueJian);
  /* 歲煞 */
  SUIQIAN.forEach(function(r){
    var pos=ZHI[(yIdx+r[1]+(r[1]<=7?0:-12)+12)%12];
    add(r[0],'歲',r[2],pos);
  });
  add('歲刑','歲','凶',SUIXING[yZhi]);
  add('死符','歲干','凶',SS_SIFU[yGan]);
  add('天庭','歲干','平',ZHI[(zi(SS_LU[yGan])-1+12)%12]);
  add('祿倒','歲干','凶',ZHI[(zi(SS_LU[yGan])+1)%12]);      /* 歲干之祿+1（實證11/11） */
  if('巳酉丑'.indexOf(yZhi)<0)                                 /* 巳酉丑年課程軟件不計算馬倒（實證0/8） */
    add('馬倒','歲支','凶',ZHI[(zi(SS_ZHI.驛馬[yZhi])+1)%12]);/* 歲支驛馬+1（實證15/15） */
  /* 季煞 */
  for(var nm in SEASON_SS){
    add(nm,'季',SEASON_SS[nm][1],SEASON_SS[nm][0][season]);
  }
  FANHUN.forEach(function(p){ if(p[0]===season) add('返魂','季','吉',p[1]); });
  /* 月煞 */
  for(var nm2 in MONTH_ROWS){
    add(nm2,'月',MONTH_JX[nm2],MONTH_ROWS[nm2][mIdx]);
  }
  /* 滅門：陽月建-3／陰月建+3（課程實證19/19） */
  add('滅門','月','凶',ZHI[(zi(yueJian)+(zi(yueJian)%2===0?-3:3)+12)%12]);
  /* 日干煞（位置為支；天德/月德/天赦另有干值） */

  add('日德','日干','吉',SS_DE[dGan]);
  add('羊刃','日干','凶',ZHI[(zi(SS_LU[dGan])+1)%12]);
  add('飛刃','日干','凶',ZHI[(zi(SS_LU[dGan])+7)%12]);
  add('長生','日干','吉',SS_CS[WXG[dGan]]);
  add('日墓','日干','凶',SS_MU[WXG[dGan]]);
  add('敗氣','日干','凶',SS_YU[WXG[dGan]]);

  add('六丁','人元','吉',null,'丁');                        /* 人元為丁 */
  var ts=tianShe(yueJian);

  add('六破','日支','凶',LIUPO[dZhi]);

  add('六害','日支','凶',LIUHAI[dZhi]);
  add('支衝','日支','凶',ZHI[(zi(dZhi)+6)%12]);
  add('驛馬','日支','吉',SS_ZHI.驛馬[dZhi]);
  add('華蓋','日支','平',SS_ZHI.華蓋[dZhi]);

  add('亡神','日支','凶',SS_ZHI.亡神[dZhi]);
  add('望門','日支','吉',SANHE_LU[dZhi]);        /* 三合局祿（實證15/15） */
  add('地煞','日支','凶',SANHE_GUIMU[dZhi]);      /* 三合局鬼墓（實證22/22） */
  add('地網','日支','凶','戌');  /* 戌固定（課程實證15/15，非三合墓） */
  add('天羅','日支','凶','辰');  /* 辰固定（課程實證21/21） */
  add('雷電','日支','平',leiDian(dZhi));
  add('白衣','日支','吉',baiYi(dZhi));
  sanXing(dZhi).forEach(function(z){ add('三刑','日支','凶',z); });
  [ZHI[(zi(dZhi)+4)%12],ZHI[(zi(dZhi)+8)%12]].forEach(function(z){ add('三合','日支','吉',z); });
  /* 旬煞 */
  xi.kong.forEach(function(z){ add('空亡','旬','凶',z); });
  add('旬儀','旬','吉',xi.xunZhi);
  add('旬三奇','旬','吉',XUN_SQ[xi.xunZhi]);
  add('旬盜','旬','凶',ZHI[(zi(xi.xunZhi)+11)%12]);
  add('旬丁','旬遁','吉',XUNDING[xi.name.slice(0,2)]);  /* 旬中丁干所遁地支（實證26/26） */
  for(var i=0;i<10;i++){
    var z2=ZHI[(zi(xi.xunZhi)+i)%12];
    var g2=GAN[i%10];
    if(g2==='乙') add('盜神','旬遁','凶',z2);
    if(g2==='庚') add('響動','旬遁','平',z2);
    if(g2==='辛') add('五亡','旬遁','凶',z2);
    if(g2==='癸') add('閉口','旬遁','凶',z2);
  }
  return out;
}

 月破:1,旬丁:1,五鬼:1,四丘:1,月厭:1,地煞:1,地網:1,祿倒:1,病符:1,喪車:1,天德:1,桃花:1,
 月合:1,月德:1,馬倒:1,破碎:1,六甲:1,六丁:1};
/* 支層：以支位比對；人元：以干比對（天德/月德/天赦/六甲/六丁/月合）。課式僅顯示精選集 */
function shenshaFor(list,layer,gan,zhi,curatedOnly){
  var r=[];
  list.forEach(function(s){
    if(curatedOnly && !CURATED_SS[s.name]) return;
    if(layer==='人元'){
      if(s.gan && s.gan===gan) r.push(s);
    }else{
      if(s.pos && s.pos===zhi) r.push(s);
    }
  });
  return r;
}

var lang='t';
var _convText=new WeakMap();
var _convAttr=new WeakMap();
var _convTitle=null;
function hasCJK(x){return /[\u4e00-\u9fff]/.test(x);}
function convStr(x,m){
  var r='',i,c;
  for(i=0;i<x.length;i++){
    c=x.charAt(i);
    r+=Object.prototype.hasOwnProperty.call(m,c)?m[c]:c;
  }
  return r;
}
function convT(x){return convStr(x,CONV_T2S);}
function convS(x){return convStr(x,CONV_S2T);}
/* 文字節點：以首次見到的原文為原稿；若內容被外部（重新渲染／使用者輸入）改動則自動更新原稿 */
function convTextNode(n){
  var t=n.nodeValue;
  if(!t||!hasCJK(t)) return;
  var o=_convText.get(n);
  if(o!==undefined){
    if(lang==='s'){ if(t!==convT(o)) o=t; }
    else { if(t!==o&&t!==convT(o)) o=t; }
  }
  if(o===undefined) o=t;
  _convText.set(n,o);
  n.nodeValue=(lang==='s')?convT(o):o;
}
/* 屬性節點：title（全部元素）＋ value（僅 input，供顯示同步） */
function convAttrNode(el){
  var attrs=['title','value'],i,a,v,st,o,isProp;
  if(el.id==='btn-lang') return;
  for(i=0;i<attrs.length;i++){
    a=attrs[i];
    if(a==='value'&&el.nodeName!=='INPUT') continue;
    isProp=(a==='value');
    v=isProp?el.value:el.getAttribute(a);
    if(!v||!hasCJK(v)) continue;
    st=_convAttr.get(el);
    if(!st){st={};_convAttr.set(el,st);}
    o=st[a];
    if(o!==undefined){
      if(lang==='s'){ if(v!==convT(o)) o=v; }
      else { if(v!==o&&v!==convT(o)) o=v; }
    }
    if(o===undefined) o=v;
    st[a]=o;
    if(isProp) el.value=(lang==='s')?convT(o):o;
    else el.setAttribute(a,(lang==='s')?convT(o):o);
  }
}
function applyLang(){
  var nodes=[],nd,
      w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
        if(!n.parentNode) return NodeFilter.FILTER_REJECT;
        var t=n.parentNode.nodeName.toLowerCase();
        if(t==='script'||t==='style'||n.parentNode.id==='btn-lang') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
  while(nd=w.nextNode()) nodes.push(nd);
  for(var i=0;i<nodes.length;i++) convTextNode(nodes[i]);
  var els=document.querySelectorAll('[title],[value]');
  for(i=0;i<els.length;i++) convAttrNode(els[i]);
  if(_convTitle===null) _convTitle=document.title;
  document.title=(lang==='s')?convT(_convTitle):_convTitle;
  document.documentElement.setAttribute('lang',(lang==='s')?'zh-Hans':'zh-Hant');
  document.documentElement.setAttribute('data-lang',lang);
  var b=$('btn-lang');
  if(b){
    b.textContent=(lang==='s')?'简体':'繁體';
    b.title=(lang==='s')?'目前为简体界面，点击切换为繁体':'目前為繁體界面，點擊切換為簡體';
  }
}
function setLang(l){
  lang=(l==='s')?'s':'t';
  try{ localStorage.setItem('jkj-lang',lang); }catch(e){}

}

/* ==================== 干支曆輸入 ==================== */

/* 干支同陰陽才可配對（10 干 × 12 支 → 60 甲子） */
function samePolar(g,z){ return (gi(g)%2)===(zi(z)%2); }
function buildGzSelects(){
  var gOpt=GAN.split('').map(function(g){return '<option value="'+g+'">'+g+'</option>';}).join('');
  var zOpt=ZHI.split('').map(function(z){return '<option value="'+z+'">'+z+'</option>';}).join('');

    $('gz-'+k+'-g').innerHTML=gOpt;
    $('gz-'+k+'-z').innerHTML=zOpt;
  });

/* 干變→支只留同陰陽；支變→干只留同陰陽（UI 上就不可能選出無效組合） */
function bindGzEvents(){
  ['y','m','d','h'].forEach(function(k){
    $('gz-'+k+'-g').onchange=function(){
      var g=$('gz-'+k+'-g').value, zs=$('gz-'+k+'-z'), fixed=false;
      if(!samePolar(g,zs.value)){
        var c=ZHI.split('').filter(function(z){return samePolar(g,z);});
        zs.value=c[0]; fixed=true;
      }
      if(k==='y') autoMonthGan();
      if(k==='d') autoHourGan();
      gzHint(fixed?'干支須同陰陽，已自動調整為 '+g+zs.value+'。':null);
    };
    $('gz-'+k+'-z').onchange=function(){
      var z=$('gz-'+k+'-z').value, gs=$('gz-'+k+'-g'), fixed=false;
      if(!samePolar(gs.value,z)){
        var c=GAN.split('').filter(function(g){return samePolar(g,z);});
        gs.value=c[0]; fixed=true;
      }
      if(k==='m') autoMonthGan();
      if(k==='h') autoHourGan();
      gzHint(fixed?'干支須同陰陽，已自動調整為 '+gs.value+z+'。':null);
    };
  });
}
/* 月干依年干（五虎遁）、時干依日干（五鼠遁）自動決定 */
function autoMonthGan(){
  var yg=$('gz-y-g').value, mz=$('gz-m-z').value;
  $('gz-m-g').value=GAN[((gi(yg)*2+2+((zi(mz)-2+12)%12))%10+10)%10];
}
function autoHourGan(){
  var dg=$('gz-d-g').value, hz=$('gz-h-z').value;
  $('gz-h-g').value=GAN[((gi(dg)*2+zi(hz))%10+10)%10];
}
function gzReadPillars(){
  return {
    y:$('gz-y-g').value+$('gz-y-z').value,
    m:$('gz-m-g').value+$('gz-m-z').value,
    d:$('gz-d-g').value+$('gz-d-z').value,
    h:$('gz-h-g').value+$('gz-h-z').value,
    mZhi:$('gz-m-z').value, hZhi:$('gz-h-z').value
  };
}
function gzHint(extra){
  var p=gzReadPillars();
  $('gz-result').innerHTML=(extra?'<span style="color:var(--ink2)">'+extra+'</span><br>':'')+
    '目前四柱：<b>'+p.y+'年　'+p.m+'月　'+p.d+'日　'+p.h+'時</b>'+
    '<br><span style="color:var(--ink2)">月干依「五虎遁」隨年干、時干依「五鼠遁」隨日干自動決定；干與支需同陰陽方成一柱。</span>';
  applyLang();
}
function fillGzFromDate(dt){
  var sz=siZhu(dt);
  $('gz-y-g').value=sz.yGan; $('gz-y-z').value=sz.yZhi;
  $('gz-m-z').value=sz.yueJian;
  $('gz-d-g').value=sz.dGan; $('gz-d-z').value=sz.dZhi;
  $('gz-h-z').value=sz.hZhi;
  autoMonthGan(); autoHourGan();
}
/* 由四柱反推公曆：先以年柱鎖定候選年（每 60 年一次），再逐日比對月支、日柱、時支 */
function gzSearch(yPillar,mZhi,dPillar,hZhi){
  var hi=zi(hZhi), hour=(hi===0?0:hi*2), hits=[];
  for(var y=1900;y<=2100;y++){
    if(ganZhiOfYear(y)!==yPillar) continue;
    var d=new Date(y,0,25), end=new Date(y+1,2,12);
    while(d<=end){
      var t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hour,30,0);
      var sz=siZhu(t);
      if(sz.yGan+sz.yZhi===yPillar && sz.yueJian===mZhi && sz.dGan+sz.dZhi===dPillar && sz.hZhi===hZhi){
        hits.push(t);
        d.setDate(d.getDate()+2);   /* 日柱 60 日一循環，跳一日安全 */
      }else{
        d.setDate(d.getDate()+1);
      }
    }
  }
  return hits;
}
function gzConvert(){
  var box=$('gz-result');
  /* 月干、時干本由年干／日干決定，換算前以遁法校正 */
  autoMonthGan(); autoHourGan();
  var p=gzReadPillars();
  /* 年月日三柱干支須同陰陽 */
  ['y','m','d','h'].forEach(function(k){
    if(!samePolar($('gz-'+k+'-g').value, $('gz-'+k+'-z').value)) console.warn('polar mismatch', k);
  });
  var hits=gzSearch(p.y, p.mZhi, p.d, p.hZhi);
  if(!hits.length){
    box.innerHTML='<span style="color:var(--zhu);font-weight:700">查無此四柱</span>　1900–2100 之間沒有相符日期。'+
      '<br><span style="color:var(--ink2)">常見原因：年柱與月柱不屬同一節氣年，或該月內並無此日柱（日柱 60 日一循環，一個月約 30 日，故有些組合不會出現）。</span>';
    return;
  }
  var now=Date.now(), nearIdx=0, best=Infinity;
  hits.forEach(function(t,i){ var dd=Math.abs(t.getTime()-now); if(dd<best){best=dd;nearIdx=i;} });
  var label='<b>'+p.y+'年　'+p.m+'月　'+p.d+'日　'+p.h+'時</b>　→　符合日期 '+hits.length+' 組（同四柱每 60 年重現），以金色標示最接近今日者；點選即起課：';
  var html=label+'<div class="gz-hit">';
  hits.forEach(function(t,i){
    html+='<button data-ts="'+t.getTime()+'" class="'+(i===nearIdx?'near':'')+'">'+fmtDT(t)+'</button>';
  });
  html+='</div>';
  box.innerHTML=html;
  box.querySelectorAll('button[data-ts]').forEach(function(b){
    b.onclick=function(){ applyGzDate(new Date(+b.getAttribute('data-ts')), p.y,p.m,p.d,p.h); };
  });
  if(hits.length===1) applyGzDate(hits[0], p.y,p.m,p.d,p.h);
}
function applyGzDate(dt,yp,mz,dp,hz){
  $('in-date').value=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  $('in-time').value=pad(dt.getHours())+':'+pad(dt.getMinutes());
  run();
  var sz=siZhu(dt);
  $('gz-result').innerHTML='<b>'+yp+'年 '+mz+'月 '+dp+'日 '+hz+'時</b>　→　公曆 <b>'+fmtDT(dt)+'</b>'+
    '<br><span style="color:var(--ink2)">實際四柱：'+sz.yGan+sz.yZhi+'年　'+sz.yueGan+sz.yueJian+'月　'+
    sz.dGan+sz.dZhi+'日　'+sz.hGan+sz.hZhi+'時　（'+sz.jieName+'後）　已起課</span>';
  applyLang();
}
/* 由輸入框推正時地支（供 UI 回饋用） */
function ke0hourFromInput(){
  var tv=$('in-time').value||'12:00', tp=tv.split(':');
  var h=+tp[0]||0;
  return ZHI[(h>=23)?0:Math.floor((h+1)/2)];
}
/* 同步地分按鈕與「現在時間」按鈕的視覺狀態：實線＝手動、虛線＝正時自動 */
function syncDiFenUI(){
  var autoZhi = diFenMode==='auto' ? ke0hourFromInput() : null;
  $('difen-btns').querySelectorAll('button').forEach(function(x){
    var z=x.getAttribute('data-z');
    x.classList.remove('on','auto');
    x.title = (autoZhi===z) ? '正時自動決定（'+autoZhi+'時）' : '手動指定地分＝'+z;
    if(diFenMode!=='auto' && z===diFenMode) x.classList.add('on');
    else if(autoZhi===z) x.classList.add('auto');
  });
  $('btn-now').classList.toggle('on', diFenMode==='auto');
  $('btn-now').title = diFenMode==='auto'
    ? '目前為正時自動模式（地分＝'+autoZhi+'）；點擊＝將時間設為此刻'
    : '點擊＝將時間設為此刻、地分取正時（仍須按「起課」）';
  applyLang();
}
function run(){
  var dv=$('in-date').value, tv=$('in-time').value||'12:00';
  if(!dv){ $('k-info').innerHTML='<div class="warn">請輸入日期</div>'; return; }
  var parts=dv.split('-'), tp=tv.split(':');
  var dt=new Date(+parts[0],+parts[1]-1,+parts[2],+tp[0]||0,+tp[1]||0,0);
  var y=dt.getFullYear();
  var warn='';
  if(y<1900||y>2100){ warn='<div class="warn">注意：節氣表僅涵蓋 1900–2100 年，超出範圍的月建／月將可能不準確。</div>'; }
  var ke=buildKe(dt, diFenMode==='auto'?ke0hour(dt):diFenMode);
  var sz=ke.sz;
  var ss=calcShensha(sz,ke.xi);
  var yong=pickYongshen(ke);
  var wy=findWangYao(ke);
  var dong=wudong(ke);
  var benming=$('in-benming').value?ganZhiOfYear(+$('in-benming').value):'';
  var xingnian=$('in-xingnian').value;
  var sex=$('in-sex').value;
  renderInfo(dt,ke,warn,sex,benming,xingnian);
  renderKe(ke,yong,wy,dong,ss);
  renderDiPan(ke,yong);
  renderYongshen(ke,yong,wy);
  renderShensha(ss,ke);
  syncDiFenUI();
  applyLang();
}
function ke0hour(dt){
  var h=dt.getHours();
  return ZHI[(h>=23)?0:Math.floor((h+1)/2)];
}

/* ---- 三、課式 ---- */
function wsCls(w){return {旺:'wang',相:'xiang',休:'xiu',囚:'qiu',死:'si'}[w]||'';}
function renderKe(ke,yong,wy,dong,ss){
  var sz=ke.sz;

   {name:'人元',gan:ke.ren.gan,zhi:null,tj:null},

   {name:'地分',gan:null,zhi:ke.di.zhi,tj:null}

    html+='<tr class="'+layCls+(isYong?' yong-row':'')+'"><td class="ke-layer">'+r.name+'</td><td class="gz">'+gzHtml+'</td><td class="wxinfo">'+
      '<span class="'+(yy?'yy-plus':'yy-minus')+'">'+(yy?'陽 +':'陰 −')+'</span> '+wx+' <span class="'+wsCls(ws)+'">'+ws+'</span>'+
      (isKong?' <span class="kong">空</span>':'')+'</td><td><span class="liuqin">'+lq+'</span></td><td>'+sstags+'</td></tr>';

  /* 動爻 */
  var dh='<div class="dong"><span class="t">動爻：</span>';

  dong.forEach(function(d){ dh+='<span style="font-size:13px;color:var(--ink2)">'+d.n+'：'+d.t+'　</span>'; });

/* ---- 地盤（九宮格方陣，每格以該地支為地分，列課式四層）---- */

    var lv=kewaiLevel(r[1],ke.sz.yueJian);
    var on=(lv===wm.level && wm.list.some(function(x){return x.name===r[0];}));
    html+='<span class="wk-chip'+(on?' on':'')+'"><i>'+r[0]+'</i>'+r[1]+
      '<span class="lv '+wsCls(lv)+'">'+lv+'</span></span>';
  });
  html+='</div>';
  html+='<div class="wk-res">課外旺爻：<b>'+wm.names+'</b><span class="tag">'+wm.level+'</span>　—　'+wm.rule+'</div>';
  html+='</div>';

  $('yongshen-box').innerHTML=html;
}
/* ---- 六、神煞總覽 ---- */
function renderShensha(ss,ke){
  var groups={};
  ss.forEach(function(s){ (groups[s.base]=groups[s.base]||[]).push(s); });
  var order=['歲','歲干','季','月','日干','日支','旬','旬遁'];
  var labels={歲:'歲煞（年支）',歲干:'歲干煞',季:'季煞（四季）',月:'月煞（月建 '+ke.sz.yueJian+'）',
    日干:'日干煞（'+ke.sz.dGan+'）',日支:'日支煞（'+ke.sz.dZhi+'）',旬:'旬煞（'+ke.xi.name+'）',旬遁:'旬遁干煞'};
  var html='';
  order.forEach(function(g){
    if(!groups[g]) return;
    html+='<div class="ss-grp"><div class="gt">'+labels[g]+'</div><div class="ss-cards">';
    groups[g].forEach(function(s){
      var pos=s.gan?('干 '+s.gan):(s.pos||'');
      var mean=(g==='月'?MONTH_MEAN[s.name]:null)||GAN_MEAN[s.name]||ZHI_MEAN[s.name]||SEASON_MEAN[s.name]||'';
      var jx=s.jx==='吉'?'ss-ji':s.jx==='凶'?'ss-xiong':'ss-ping';
      html+='<div class="ss-card" title="'+(mean||'')+'"><span class="sn '+(s.jx==='吉'?'wang':s.jx==='凶'?'si':'')+'">'+s.name+'</span> '+
        '<span class="sp '+jx+'">'+pos+'</span></div>';
    });
    html+='</div></div>';
  });
  $('shensha-box').innerHTML=html;
}
if(typeof document!=='undefined' && document.getElementById){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initUI);
  else initUI();
}
